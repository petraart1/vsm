<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>ReactLab — тренажёр проводника ВСМ</title>
<script>
  // Тема до первого рендера — без вспышки светлого фона у тех, кто выбрал тёмную.
  try {
    var t = localStorage.getItem("reactlab.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    var st = localStorage.getItem("reactlab.style");
    document.documentElement.setAttribute("data-style", st || "mono");
  } catch (e) {
    document.documentElement.setAttribute("data-style", "mono");
  }
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
