spring.application.name=backend

# --- Virtual threads (REST) ---
spring.threads.virtual.enabled=true

# --- PostgreSQL datasource (dev defaults, override via env in real deploys) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vsm}
spring.datasource.username=${DB_USER:vsm}
spring.datasource.password=${DB_PASSWORD:vsm}

# JPA: schema managed exclusively by Liquibase, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Liquibase ---
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# --- springdoc-openapi / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- CORS for /api/** (dev frontend on :3000; same-origin static frontend below needs none) ---
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# --- Default admin account, created at startup if missing (see AdminAccountInitializer) ---
# Demo-only defaults — change via env vars (APP_AUTH_ADMIN_LOGIN/APP_AUTH_ADMIN_PASSWORD) in prod.
app.auth.admin.login=${APP_AUTH_ADMIN_LOGIN:admin}
app.auth.admin.password=${APP_AUTH_ADMIN_PASSWORD:admin123}

# --- JWT (login token), see auth/security/JwtService ---
# Demo-only secret — change via APP_AUTH_JWT_SECRET in prod (HS256 needs >= 32 bytes).
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:vsm-demo-jwt-secret-please-change-in-production-0123456789abcdef}
app.auth.jwt.expiration-minutes=${APP_AUTH_JWT_EXPIRATION_MINUTES:1440}

# --- Authorization enforcement (step 3), see config/SecurityConfig ---
# /api/admin/** and /api/editor/** require role ADMIN. Set to false to temporarily open both back
# up without a token (e.g. demoing before the frontend has a login screen wired up).
app.auth.admin-protection-enabled=${APP_AUTH_ADMIN_PROTECTION_ENABLED:true}

# --- ESIA (Gosuslugi) mock login stub, see auth/esia and README "Вход через Госуслуги (заглушка)" ---
# Fake OAuth2/OIDC-like flow with a handful of test citizens; NOT a real ESIA integration.
app.esia.mock.enabled=${APP_ESIA_MOCK_ENABLED:true}

# --- Gamification antifraud limits, see config/GamificationLimitsProperties ---
# Daily (UTC calendar day) points cap per player and the points multiplier for a profile that has
# not gone through ESIA verification (see app.esia.mock above). Overridden to full points for the
# "demo" profile (application-demo.properties) since seeded demo players never go through ESIA.
app.gamification.daily-points-limit=${APP_GAMIFICATION_DAILY_POINTS_LIMIT:3000}
app.gamification.unverified-multiplier=${APP_GAMIFICATION_UNVERIFIED_MULTIPLIER:0.5}
