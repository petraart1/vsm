spring.application.name=backend

# --- Virtual threads (REST) ---
spring.threads.virtual.enabled=true

# --- HTTP port. Render (and most PaaS hosts) inject PORT at runtime; SERVER_PORT stays as the
# docker-compose/local override, 8080 is the final fallback. ---
server.port=${PORT:${SERVER_PORT:8080}}

# --- PostgreSQL datasource (dev defaults, override via env in real deploys) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vsm}
spring.datasource.username=${DB_USER:vsm}
spring.datasource.password=${DB_PASSWORD:vsm}

# JPA: schema managed exclusively by Liquibase, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Liquibase ---
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# --- springdoc-openapi / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- CORS for /api/** (dev frontend on :3000; same-origin static frontend below needs none).
# Override with a comma-separated list (e.g. the deployed frontend's public URL) via
# APP_CORS_ALLOWED_ORIGINS. ---
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# --- Default admin account, created at startup if missing (see AdminAccountInitializer) ---
# Demo-only defaults — change via env vars (APP_AUTH_ADMIN_LOGIN/APP_AUTH_ADMIN_PASSWORD) in prod.
app.auth.admin.login=${APP_AUTH_ADMIN_LOGIN:admin}
app.auth.admin.password=${APP_AUTH_ADMIN_PASSWORD:admin123}

# --- Login brute-force limit, see auth/security/LoginRateLimiter ---
# In-memory limit per (login, IP): after max-attempts failed logins in a row, that pair is locked
# out for block-duration-seconds, further attempts get 429 too_many_attempts.
app.auth.login-rate-limit.max-attempts=${APP_AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.auth.login-rate-limit.block-duration-seconds=${APP_AUTH_LOGIN_RATE_LIMIT_BLOCK_SECONDS:60}

# --- JWT (login token), see auth/security/JwtService ---
# Demo-only secret — change via APP_AUTH_JWT_SECRET in prod (HS256 needs >= 32 bytes).
app.auth.jwt.secret=${APP_AUTH_JWT_SECRET:vsm-demo-jwt-secret-please-change-in-production-0123456789abcdef}
app.auth.jwt.expiration-minutes=${APP_AUTH_JWT_EXPIRATION_MINUTES:1440}

# --- Authorization enforcement (step 3), see config/SecurityConfig ---
# /api/admin/** and /api/editor/** require role ADMIN. Set to false to temporarily open both back
# up without a token (e.g. demoing before the frontend has a login screen wired up).
app.auth.admin-protection-enabled=${APP_AUTH_ADMIN_PROTECTION_ENABLED:true}

# --- Strict mode: require-token, see config/SecurityConfig and PlayerAccessGuard ---
# When true, X-Player-Id/?playerId= are no longer trusted as a standalone identity on game
# endpoints/WebSocket — a valid JWT is required instead. Off by default (anonymous play via
# X-Player-Id is the default MVP identification model, see README "Авторизация").
app.auth.require-token=${APP_AUTH_REQUIRE_TOKEN:false}

# --- Public leaderboard identity, see auth/security/PlayerPublicIdService ---
# HMAC key turning a real playerId into an unguessable publicId for public responses (leaderboard)
# — see README "Безопасность": a real playerId must never leak there, it's trusted as a full
# identity on write endpoints via X-Player-Id. Demo-only default — change via env in prod.
app.security.public-id-secret=${APP_SECURITY_PUBLIC_ID_SECRET:vsm-demo-public-id-secret-please-change-in-production-0123456789}

# --- ESIA (Gosuslugi) mock login stub, see auth/esia and README "Вход через Госуслуги (заглушка)" ---
# Fake OAuth2/OIDC-like flow with a handful of test citizens; NOT a real ESIA integration.
app.esia.mock.enabled=${APP_ESIA_MOCK_ENABLED:true}

# --- Gamification antifraud limits, see config/GamificationLimitsProperties ---
# Daily (UTC calendar day) points cap per player and the points multiplier for a profile that has
# not gone through ESIA verification (see app.esia.mock above). Overridden to full points for the
# "demo" profile (application-demo.properties) since seeded demo players never go through ESIA.
app.gamification.daily-points-limit=${APP_GAMIFICATION_DAILY_POINTS_LIMIT:3000}
app.gamification.unverified-multiplier=${APP_GAMIFICATION_UNVERIFIED_MULTIPLIER:0.5}

# --- Points expiry (sgorayushchiye points), see config/PointsExpiryProperties and
# gamification/expiry/service/PointsExpiryService. inactivity-days: how many days without real
# activity before points-percent of totalScore expires; warning-days: how many days before that
# expiry the POINTS_EXPIRING notification fires (once per inactivity period); cron: daily
# scheduled run (also triggerable on demand via POST /api/admin/points-expiry/run).
app.gamification.points-expiry.inactivity-days=${APP_GAMIFICATION_POINTS_EXPIRY_INACTIVITY_DAYS:14}
app.gamification.points-expiry.expiry-percent=${APP_GAMIFICATION_POINTS_EXPIRY_EXPIRY_PERCENT:10}
app.gamification.points-expiry.warning-days=${APP_GAMIFICATION_POINTS_EXPIRY_WARNING_DAYS:3}
app.gamification.points-expiry.cron=${APP_GAMIFICATION_POINTS_EXPIRY_CRON:0 0 3 * * *}
