# --- Demo profile overrides (see DemoDataSeeder, "demo" profile) ---
# Demo players are seeded playthroughs, not real accounts that went through ESIA verification, so
# GamificationLimitsProperties.unverifiedMultiplier would otherwise halve their showcased scores.
# Full points for the demo leaderboard/stats without touching the antifraud default for real play.
app.gamification.unverified-multiplier=1.0
