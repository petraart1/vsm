databaseChangeLog:
  - changeSet:
      id: gamification-009-notification-type-team-rank-up
      author: vsm
      comment: >
        Расширяет допустимые значения gamification_notification.type новым TEAM_RANK_UP —
        уведомление всем участникам команды о выходе команды на 1-е место в командном рейтинге
        (см. gamification.team).
      changes:
        - sql:
            sql: ALTER TABLE gamification_notification DROP CONSTRAINT chk_notification_type
        - sql:
            comment: type — допустимые значения (согласовано с gamification.domain.NotificationType)
            sql: >-
              ALTER TABLE gamification_notification ADD CONSTRAINT chk_notification_type
              CHECK (type IN ('ACHIEVEMENT_UNLOCKED', 'NEW_PERSONAL_BEST', 'LEADERBOARD_RANK_UP',
              'RECOMMENDED_SCENARIO', 'CHALLENGE_COMPLETED', 'TEAM_RANK_UP'))
