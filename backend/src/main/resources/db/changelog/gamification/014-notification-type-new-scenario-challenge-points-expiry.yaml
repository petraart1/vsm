databaseChangeLog:
  - changeSet:
      id: gamification-014-notification-type-new-scenario-challenge-points-expiry
      author: vsm
      comment: >
        Расширяет допустимые значения gamification_notification.type четырьмя новыми: NEW_SCENARIO
        (появился новый сценарий), NEW_CHALLENGE (создано новое событие/челлендж),
        POINTS_EXPIRING/POINTS_EXPIRED (сгорание баллов за неактивность, см.
        gamification.expiry.service.PointsExpiryService).
      changes:
        - sql:
            sql: ALTER TABLE gamification_notification DROP CONSTRAINT chk_notification_type
        - sql:
            comment: type — допустимые значения (согласовано с gamification.domain.NotificationType)
            sql: >-
              ALTER TABLE gamification_notification ADD CONSTRAINT chk_notification_type
              CHECK (type IN ('ACHIEVEMENT_UNLOCKED', 'NEW_PERSONAL_BEST', 'LEADERBOARD_RANK_UP',
              'RECOMMENDED_SCENARIO', 'CHALLENGE_COMPLETED', 'TEAM_RANK_UP', 'EXAM_COMPLETED',
              'NEW_SCENARIO', 'NEW_CHALLENGE', 'POINTS_EXPIRING', 'POINTS_EXPIRED'))
