databaseChangeLog:
  - changeSet:
      id: common-001-create-app-user
      author: vsm
      comment: >
        Учётная запись (регистрация/авторизация, роли USER/ADMIN). id — тот же playerId,
        что используется в остальном приложении (заголовок X-Player-Id, gamification_player_profile.id,
        user_progress.player_id) — без FK на них, связь только по id, как между остальными доменами.
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: login
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_app_user_login
              - column:
                  name: email
                  type: varchar(254)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_app_user_email
              - column:
                  name: password_hash
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: varchar(100)
              - column:
                  name: role
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
