databaseChangeLog:
  # Порядок важен: common (общие справочники/таблицы) -> домены.
  # Пути — относительно каталога этого файла (db/changelog/), т.к. relativeToChangelogFile: true.
  # errorIfMissingOrEmpty: false — пока домен не положил свои changeset'ы, каталог может быть пустым.
  # endsWithFilter: ".yaml" — includeAll подбирает только changeset-файлы, не пытается парсить
  # служебный .gitkeep, которым домен резервирует пустую папку до первого changeset'а.
  - includeAll:
      path: common/
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false
      endsWithFilter: ".yaml"
  - includeAll:
      path: scenario/
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false
      endsWithFilter: ".yaml"
  - includeAll:
      path: gamification/
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false
      endsWithFilter: ".yaml"
  - includeAll:
      path: feedback/
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false
      endsWithFilter: ".yaml"
